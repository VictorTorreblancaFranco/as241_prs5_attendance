name: Attendance quality

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit and parameterized tests with JaCoCo
        run: mvn -B clean test

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v5
        with:
          name: attendance-jacoco-report
          path: target/site/jacoco

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=VictorTorreblancaFranco_vg-ms-attendance
          -Dsonar.organization=victortorreblancafranco
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
