server:
  port: ${SERVER_PORT:5085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

# Secret para salidas servicio→servicio (comms lo exige). Entrada:
# attendance.internal-secret (más abajo) sigue vacío por defecto para no
# romper llamadas MS→MS entrantes sin secret (p. ej. welfare → attendance).
internal-secret: ${INTERNAL_SECRET:${ATTENDANCE_INTERNAL_SECRET:edunova-internal-trust}}

spring:
  application:
    name: ${SPRING_APP_NAME:vg-ms-attendance}
  # Ejecuta schema.sql al arrancar: sin esto una base nueva no tiene las tablas y
  # el servicio no levanta. Es idempotente, asi que no afecta a bases ya migradas.
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      continue-on-error: false
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://ep-spring-bird-b4g1sfn8-pooler.c-6.us-east-2.aws.neon.tech/attendance?sslMode=require&channelBinding=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_lTIA6pzx5wsm}
    pool:
      initial-size: ${SPRING_R2DBC_POOL_INITIAL_SIZE:2}
      max-size: ${SPRING_R2DBC_POOL_MAX_SIZE:10}
      max-idle-time: ${SPRING_R2DBC_POOL_MAX_IDLE_TIME:30m}
      max-life-time: ${SPRING_R2DBC_POOL_MAX_LIFE_TIME:60m}
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=100
  codec:
    max-in-memory-size: 10MB
  webflux:
    multipart:
      max-in-memory-size: 256KB
      max-disk-usage-per-part: 10MB
      max-parts: 1

logging:
  level:
    root: ${LOG_ROOT_LEVEL:INFO}
    com.vg.attendance: ${LOG_ATTENDANCE_LEVEL:DEBUG}
    org.springframework.r2dbc: ${LOG_R2DBC_LEVEL:INFO}
    io.r2dbc.postgresql: ${LOG_POSTGRESQL_LEVEL:INFO}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n'
  file:
    name: ${LOG_FILE_NAME:logs/attendance-service.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:doz1fu1er}
  api-key: ${CLOUDINARY_API_KEY:295184475961158}
  api-secret: ${CLOUDINARY_API_SECRET:H8HdnkN8NKdhZL-d75T1qIaOpyU}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

attendance:
  internal-secret: ${ATTENDANCE_INTERNAL_SECRET:}
  # Las rutas de negocio deben estar aisladas por institución. Los roles
  # globales pueden operar sin X-Tenant-Id cuando el gateway así lo autoriza.
  tenant-required: ${ATTENDANCE_TENANT_REQUIRED:true}
  clients:
    timeout: ${ATTENDANCE_CLIENT_TIMEOUT:5s}
  rate-limit:
    enabled: ${ATTENDANCE_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${ATTENDANCE_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
  roster-cache:
    # Attendance consulta el padrón actualizado en cada operación. Si se
    # necesita caché temporal por capacidad, debe habilitarse explícitamente.
    ttl: ${ATTENDANCE_ROSTER_CACHE_TTL:0s}
    maximum-size: ${ATTENDANCE_ROSTER_CACHE_MAXIMUM_SIZE:500}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tryItOutEnabled: true
    filter: true

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://vg-ms-schedule:5083}

enrollment:
  service:
    url: ${ENROLLMENT_SERVICE_URL:http://vg-ms-enrollment:5087}

user:
  service:
    url: ${USER_SERVICE_URL:http://vg-ms-user:5082}

academic:
  service:
    url: ${ACADEMIC_SERVICE_URL:http://vg-ms-academic:5089}

services:
  comms:
    url: ${SERVICES_COMMS_URL:http://vg-ms-comms:5088}

# School information for reports
school:
  name: ${SCHOOL_NAME:INSTITUCIÓN EDUCATIVA PÚBLICA MIXTO SAN LUIS}
  modular-code: ${SCHOOL_MODULAR_CODE:0286427}
  local-code: ${SCHOOL_LOCAL_CODE:354416}

# Resilience4j logging
logging.level.io.github.resilience4j: DEBUG
logging.level.io.github.resilience4j.circuitbreaker: DEBUG
logging.level.io.github.resilience4j.retry: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      scheduleService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      enrollmentService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      userService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # Una denegación de permisos no significa que users esté caído.
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
      academicService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      scheduleService:
        max-attempts: 3
        wait-duration: 1s
      enrollmentService:
        max-attempts: 3
        wait-duration: 1s
      userService:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$Forbidden
          - org.springframework.web.reactive.function.client.WebClientResponseException$Unauthorized
      academicService:
        max-attempts: 3
        wait-duration: 1s
