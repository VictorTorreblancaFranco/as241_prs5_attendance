server:
  port: ${SERVER_PORT:5085}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: ${SPRING_APP_NAME:vg-ms-attendance}
  r2dbc:
    url: ${DB_URL:r2dbc:postgresql://ep-twilight-rain-aquzch63-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_gevd5bEc4Gai}
    pool:
      initial-size: ${SPRING_R2DBC_POOL_INITIAL_SIZE:2}
      max-size: ${SPRING_R2DBC_POOL_MAX_SIZE:10}
      max-idle-time: ${SPRING_R2DBC_POOL_MAX_IDLE_TIME:30m}
      max-life-time: ${SPRING_R2DBC_POOL_MAX_LIFE_TIME:60m}
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=1h,maximumSize=100
  codec:
    max-in-memory-size: 10MB
  webflux:
    multipart:
      max-in-memory-size: 256KB
      max-disk-usage-per-part: 10MB
      max-parts: 1

logging:
  level:
    root: ${LOG_ROOT_LEVEL:INFO}
    com.vg.attendance: ${LOG_ATTENDANCE_LEVEL:DEBUG}
    org.springframework.r2dbc: ${LOG_R2DBC_LEVEL:INFO}
    io.r2dbc.postgresql: ${LOG_POSTGRESQL_LEVEL:INFO}
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} - %level - [%thread] - %logger{36} - %msg%n'
  file:
    name: ${LOG_FILE_NAME:logs/attendance-service.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:doz1fu1er}
  api-key: ${CLOUDINARY_API_KEY:295184475961158}
  api-secret: ${CLOUDINARY_API_SECRET:H8HdnkN8NKdhZL-d75T1qIaOpyU}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: false

attendance:
  internal-secret: ${ATTENDANCE_INTERNAL_SECRET:}
  clients:
    timeout: ${ATTENDANCE_CLIENT_TIMEOUT:5s}
  rate-limit:
    enabled: ${ATTENDANCE_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${ATTENDANCE_RATE_LIMIT_REQUESTS_PER_MINUTE:120}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tryItOutEnabled: true
    filter: true

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://vg-ms-schedule:5083}

enrollment:
  service:
    url: ${ENROLLMENT_SERVICE_URL:http://vg-ms-enrollment:5087}

user:
  service:
    url: ${USER_SERVICE_URL:http://vg-ms-user:5082}

academic:
  service:
    url: ${ACADEMIC_SERVICE_URL:http://vg-ms-academic:5089}

services:
  comms:
    url: ${SERVICES_COMMS_URL:http://vg-ms-comms:5088}

# School information for reports
school:
  name: ${SCHOOL_NAME:INSTITUCIÓN EDUCATIVA PÚBLICA MIXTO SAN LUIS}
  modular-code: ${SCHOOL_MODULAR_CODE:0286427}
  local-code: ${SCHOOL_LOCAL_CODE:354416}

# Resilience4j logging
logging.level.io.github.resilience4j: DEBUG
logging.level.io.github.resilience4j.circuitbreaker: DEBUG
logging.level.io.github.resilience4j.retry: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      scheduleService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      enrollmentService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      userService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      scheduleService:
        max-attempts: 3
        wait-duration: 1s
      enrollmentService:
        max-attempts: 3
        wait-duration: 1s
      userService:
        max-attempts: 3
        wait-duration: 1s
